<!DOCTYPE html>
<html>
<head>
    <title>Trophy Favicon Generator</title>
</head>
<body style="margin: 0; padding: 20px; font-family: system-ui;">
    <h2>Trophy Favicon Generator</h2>
    <p>This page helps generate a trophy emoji favicon.</p>
    
    <div style="display: flex; gap: 20px; align-items: center;">
        <div>
            <h3>16x16</h3>
            <canvas id="canvas16" width="16" height="16" style="border: 1px solid #ccc; image-rendering: pixelated; width: 64px; height: 64px;"></canvas>
        </div>
        <div>
            <h3>32x32</h3>
            <canvas id="canvas32" width="32" height="32" style="border: 1px solid #ccc; image-rendering: pixelated; width: 64px; height: 64px;"></canvas>
        </div>
        <div>
            <h3>64x64</h3>
            <canvas id="canvas64" width="64" height="64" style="border: 1px solid #ccc;"></canvas>
        </div>
    </div>
    
    <div style="margin-top: 20px;">
        <button onclick="downloadFavicon()">Download favicon.png (32x32)</button>
    </div>
    
    <script>
        function drawEmoji(canvasId, size) {
            const canvas = document.getElementById(canvasId);
            const ctx = canvas.getContext('2d');
            
            // Clear canvas
            ctx.clearRect(0, 0, size, size);
            
            // Set font and draw emoji
            ctx.font = `${size * 0.75}px system-ui`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('🏆', size / 2, size / 2);
        }
        
        // Draw on all canvases
        drawEmoji('canvas16', 16);
        drawEmoji('canvas32', 32);
        drawEmoji('canvas64', 64);
        
        function downloadFavicon() {
            const canvas = document.getElementById('canvas32');
            canvas.toBlob(function(blob) {
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'favicon.png';
                a.click();
                URL.revokeObjectURL(url);
            });
        }
    </script>
</body>
</html>
