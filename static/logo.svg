<svg width="800" height="200" viewBox="0 0 800 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradients -->
    <linearGradient id="purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="50%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#d946ef"/>
    </linearGradient>

    <linearGradient id="gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24"/>
      <stop offset="100%" style="stop-color:#f59e0b"/>
    </linearGradient>

    <!-- Subtle glow -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Icon: Rising bars forming a leaderboard -->
  <g transform="translate(100, 100)">
    <!-- Bars representing rankings (3 bars, podium style) -->

    <!-- 3rd place - shortest -->
    <rect x="0" y="40" width="35" height="60" rx="6" fill="url(#purple)" opacity="0.4"/>
    <text x="17.5" y="75" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="600" fill="white" text-anchor="middle" opacity="0.6">3</text>

    <!-- 1st place - tallest (center) -->
    <rect x="50" y="0" width="35" height="100" rx="6" fill="url(#gold)" filter="url(#glow)"/>
    <circle cx="67.5" cy="20" r="12" fill="white" opacity="0.9"/>
    <text x="67.5" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#f59e0b" text-anchor="middle">1</text>

    <!-- 2nd place - medium -->
    <rect x="100" y="25" width="35" height="75" rx="6" fill="url(#purple)" opacity="0.6"/>
    <text x="117.5" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="600" fill="white" text-anchor="middle" opacity="0.8">2</text>

    <!-- Ascending dots suggesting more rankings below -->
    <circle cx="17.5" cy="115" r="3" fill="url(#purple)" opacity="0.2"/>
    <circle cx="67.5" cy="115" r="3" fill="url(#purple)" opacity="0.2"/>
    <circle cx="117.5" cy="115" r="3" fill="url(#purple)" opacity="0.2"/>
  </g>

  <!-- Text -->
  <g transform="translate(270, 0)">
    <text x="0" y="90" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="48" font-weight="700" fill="#e0e7ff" letter-spacing="-0.02em">
      GSwap Trading
    </text>
    <text x="0" y="140" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="48" font-weight="700" fill="url(#purple)" letter-spacing="-0.02em">
      Leaderboard
    </text>
  </g>

  <!-- Subtle accent line -->
  <line x1="270" y1="155" x2="520" y2="155" stroke="url(#purple)" stroke-width="3" opacity="0.3" stroke-linecap="round"/>
</svg>
