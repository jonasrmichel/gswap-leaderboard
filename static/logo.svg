<svg width="800" height="200" viewBox="0 0 800 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16162a;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="purpleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d946ef;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>

    <!-- Glow effect -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="200" rx="16" fill="url(#bgGradient)"/>

  <!-- Abstract wallet blocks flowing to trophy -->
  <g transform="translate(60, 60)">
    <!-- Wallet block 1 (dim) -->
    <rect x="0" y="0" width="40" height="40" rx="8" fill="#2a2a4a" opacity="0.5"/>
    <rect x="8" y="12" width="24" height="4" rx="2" fill="#6366f1" opacity="0.3"/>
    <rect x="8" y="20" width="16" height="4" rx="2" fill="#6366f1" opacity="0.3"/>

    <!-- Wallet block 2 (dim) -->
    <rect x="60" y="0" width="40" height="40" rx="8" fill="#2a2a4a" opacity="0.5"/>
    <rect x="68" y="12" width="24" height="4" rx="2" fill="#6366f1" opacity="0.3"/>
    <rect x="68" y="20" width="16" height="4" rx="2" fill="#6366f1" opacity="0.3"/>

    <!-- Wallet block 3 (bright - winner) -->
    <rect x="120" y="0" width="40" height="40" rx="8" fill="url(#purpleGradient)" filter="url(#glow)"/>
    <rect x="128" y="12" width="24" height="4" rx="2" fill="white" opacity="0.9"/>
    <rect x="128" y="20" width="16" height="4" rx="2" fill="white" opacity="0.9"/>

    <!-- Wallet block 4 (bright - winner) -->
    <rect x="180" y="0" width="40" height="40" rx="8" fill="url(#purpleGradient)" filter="url(#glow)"/>
    <rect x="188" y="12" width="24" height="4" rx="2" fill="white" opacity="0.9"/>
    <rect x="188" y="20" width="16" height="4" rx="2" fill="white" opacity="0.9"/>

    <!-- Wallet block 5 (bright - winner) -->
    <rect x="240" y="0" width="40" height="40" rx="8" fill="url(#purpleGradient)" filter="url(#glow)"/>
    <rect x="248" y="12" width="24" height="4" rx="2" fill="white" opacity="0.9"/>
    <rect x="248" y="20" width="16" height="4" rx="2" fill="white" opacity="0.9"/>

    <!-- Wallet block 6 (dim) -->
    <rect x="300" y="0" width="40" height="40" rx="8" fill="#2a2a4a" opacity="0.5"/>
    <rect x="308" y="12" width="24" height="4" rx="2" fill="#6366f1" opacity="0.3"/>
    <rect x="308" y="20" width="16" height="4" rx="2" fill="#6366f1" opacity="0.3"/>

    <!-- Wallet block 7 (dim) -->
    <rect x="360" y="0" width="40" height="40" rx="8" fill="#2a2a4a" opacity="0.5"/>
    <rect x="368" y="12" width="24" height="4" rx="2" fill="#6366f1" opacity="0.3"/>
    <rect x="368" y="20" width="16" height="4" rx="2" fill="#6366f1" opacity="0.3"/>

    <!-- Connection lines pointing down -->
    <line x1="140" y1="45" x2="140" y2="60" stroke="url(#purpleGradient)" stroke-width="3" opacity="0.6"/>
    <line x1="200" y1="45" x2="200" y2="60" stroke="url(#purpleGradient)" stroke-width="3" opacity="0.6"/>
    <line x1="260" y1="45" x2="260" y2="60" stroke="url(#purpleGradient)" stroke-width="3" opacity="0.6"/>

    <!-- Converging lines -->
    <line x1="140" y1="60" x2="200" y2="75" stroke="url(#purpleGradient)" stroke-width="2" opacity="0.4"/>
    <line x1="260" y1="60" x2="200" y2="75" stroke="url(#purpleGradient)" stroke-width="2" opacity="0.4"/>
  </g>

  <!-- Trophy/Podium -->
  <g transform="translate(240, 135)">
    <!-- Podium base -->
    <rect x="0" y="20" width="80" height="30" rx="4" fill="url(#goldGradient)" filter="url(#glow)"/>

    <!-- Trophy cup -->
    <path d="M 20 0 L 15 20 L 65 20 L 60 0 Z" fill="url(#goldGradient)" filter="url(#glow)"/>

    <!-- Trophy handles -->
    <path d="M 15 5 Q 5 5 5 12 Q 5 18 15 18" stroke="url(#goldGradient)" stroke-width="2" fill="none"/>
    <path d="M 65 5 Q 75 5 75 12 Q 75 18 65 18" stroke="url(#goldGradient)" stroke-width="2" fill="none"/>

    <!-- Rank #1 -->
    <text x="40" y="38" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white" text-anchor="middle">#1</text>
  </g>

  <!-- Text: GSwap Trading Leaderboard -->
  <text x="400" y="110" font-family="Arial, sans-serif" font-size="42" font-weight="bold" fill="#e0e7ff" text-anchor="middle">
    GSwap Trading
  </text>
  <text x="400" y="150" font-family="Arial, sans-serif" font-size="42" font-weight="bold" fill="url(#purpleGradient)" text-anchor="middle">
    Leaderboard
  </text>

  <!-- Decorative elements -->
  <circle cx="720" cy="50" r="3" fill="#8b5cf6" opacity="0.6"/>
  <circle cx="740" cy="70" r="2" fill="#d946ef" opacity="0.4"/>
  <circle cx="760" cy="50" r="2" fill="#6366f1" opacity="0.5"/>
  <circle cx="730" cy="140" r="3" fill="#8b5cf6" opacity="0.6"/>
  <circle cx="750" cy="160" r="2" fill="#d946ef" opacity="0.4"/>
  <circle cx="770" cy="140" r="2" fill="#6366f1" opacity="0.5"/>
</svg>
